services:
  cccc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: cccc
    container_name: cccc
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${CCCC_PORT:-8848}:8848"
    volumes:
      - cccc-data:/data
      - cccc-home:/home/cccc
      - ${WORKSPACE_PATH:-.}:/workspace
    environment:
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Referenced by ~/.factory/settings.json customModels (${OMNI_API_URL} / ${OMNI_API_KEY}).
      # Do not name these FACTORY_*: droid reserves FACTORY_API_KEY/FACTORY_API_URL
      # for its own Factory backend authentication.
      - OMNI_API_URL=${OMNI_API_URL:-}
      - OMNI_API_KEY=${OMNI_API_KEY:-}

volumes:
  cccc-data:
    external: true
  cccc-home:
